<title>SMTCell 製程立體剖析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Progressive enhancement: this stylesheet is used when the network allows
     it and silently ignored when it does not. Every stack below names real
     system faces (including CJK) so the page reads correctly either way. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ---- Single committed visual world: a mask-layout instrument panel.
       Every colour is painted explicitly so the page holds on any host ground. ---- */
:root{
  --ground:#080c11;
  --ground-2:#0d131a;
  --panel:#111922;
  --panel-2:#16212c;
  --rule:#22303d;
  --rule-soft:#1a2530;
  --ink:#d9e4ee;
  --ink-2:#9db0c2;
  --ink-dim:#6d8093;
  --accent:#ff7a45;
  --accent-2:#ffb08a;
  --accent-dim:rgba(255,122,69,.14);
  --good:#5ee0c8;
  --stage:#060a0e;
  --shadow:0 18px 44px rgba(0,0,0,.55);
  --fs-body:15px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Microsoft YaHei","Noto Sans CJK TC","Hiragino Sans GB","Heiti TC",sans-serif;
  font-size:var(--fs-body);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{
  font-family:'IBM Plex Sans Condensed','Noto Sans TC',system-ui,"PingFang TC","Microsoft JhengHei","Microsoft YaHei","Noto Sans CJK TC","Hiragino Sans GB","Heiti TC",sans-serif;
  text-wrap:balance;
  margin:0;
}
code,.mono,kbd{font-family:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,"DejaVu Sans Mono",monospace}
a{color:var(--accent-2);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding:14px clamp(16px,3.5vw,40px);
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,var(--ground-2),var(--ground));
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:'IBM Plex Sans Condensed','Noto Sans TC',"PingFang TC","Microsoft JhengHei","Microsoft YaHei","Noto Sans CJK TC","Hiragino Sans GB","Heiti TC",sans-serif;font-size:19px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{
  appearance:none;border:0;background:transparent;color:var(--ink-2);
  font:600 13px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;
  padding:9px 16px;cursor:pointer;border-right:1px solid var(--rule-soft);transition:.14s;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#12070200;color:#180a03;text-shadow:none}
.cellchip{
  font:500 12px/1 'IBM Plex Mono',monospace;color:var(--ink-dim);
  border:1px dashed var(--rule);border-radius:6px;padding:7px 11px;
}
.cellchip b{color:var(--good);font-weight:600}

/* ---------- spec strip ---------- */
.specs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:1px;background:var(--rule-soft);
  border-bottom:1px solid var(--rule);
}
.spec{background:var(--ground-2);padding:12px clamp(14px,2vw,20px)}
.spec dt{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin:0 0 3px}
.spec dd{margin:0;font:500 13.5px/1.45 'IBM Plex Mono',monospace;color:var(--ink);word-break:break-word}

/* ---------- viewer ---------- */
.viewer{display:grid;grid-template-columns:308px 1fr;min-height:0}
@media (max-width:900px){.viewer{grid-template-columns:1fr}}
.rail{
  border-right:1px solid var(--rule);background:var(--ground-2);
  display:flex;flex-direction:column;max-height:660px;
}
@media (max-width:900px){.rail{max-height:290px;border-right:0;border-bottom:1px solid var(--rule)}}
.rail-head{padding:13px 16px 10px;border-bottom:1px solid var(--rule-soft)}
.rail-head h2{font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.rail-head p{margin:5px 0 0;font-size:12px;line-height:1.6;color:var(--ink-dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-bottom:1px solid var(--rule-soft)}
.chip{
  appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  font:500 11.5px/1 'IBM Plex Sans','Noto Sans TC',"PingFang TC","Microsoft JhengHei","Microsoft YaHei","Noto Sans CJK TC","Hiragino Sans GB","Heiti TC",sans-serif;padding:5px 9px;border-radius:99px;cursor:pointer;transition:.13s;
}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);color:var(--accent-2)}
.rail-list{overflow-y:auto;flex:1;padding:6px 0 14px}
.lrow{
  display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:9px;
  width:100%;text-align:left;appearance:none;background:transparent;border:0;
  border-left:2px solid transparent;
  padding:6px 14px 6px 12px;cursor:pointer;color:inherit;font:inherit;transition:background .12s;
}
.lrow:hover{background:var(--panel)}
.lrow[data-on="0"]{opacity:.34}
.lrow[data-empty="1"] .lname{color:var(--ink-dim);font-style:italic}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.22)}
.lrow[data-on="0"] .sw{background:transparent !important}
.lname{font:600 13px/1.3 'IBM Plex Mono',monospace;letter-spacing:-.01em}
.lmeta{font-size:11px;color:var(--ink-dim);line-height:1.35;font-family:'IBM Plex Mono',monospace}
.lz{font:500 11px/1.3 'IBM Plex Mono',monospace;color:var(--ink-dim);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.stage{position:relative;background:var(--stage);min-height:520px}
#gl{display:block;width:100%;height:100%}
.hud{
  position:absolute;left:16px;bottom:16px;right:16px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 15px;border:1px solid var(--rule);border-radius:9px;
  background:rgba(13,19,26,.86);backdrop-filter:blur(9px);box-shadow:var(--shadow);
}
.hud label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;white-space:nowrap}
.hud input[type=range]{accent-color:var(--accent);width:150px;vertical-align:middle}
.hud .val{font:500 12px/1 'IBM Plex Mono',monospace;color:var(--accent-2);min-width:34px;display:inline-block;font-variant-numeric:tabular-nums}
.hud button{
  appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);
  font:500 12px/1 'IBM Plex Sans','Noto Sans TC',"PingFang TC","Microsoft JhengHei","Microsoft YaHei","Noto Sans CJK TC","Hiragino Sans GB","Heiti TC",sans-serif;padding:7px 12px;border-radius:6px;cursor:pointer;transition:.13s;
}
.hud button:hover{border-color:var(--accent);color:var(--ink)}
.hud .hint{margin-left:auto;font-size:11px;color:var(--ink-dim);white-space:nowrap}
.axes{
  position:absolute;top:14px;left:16px;font:500 11px/1.7 'IBM Plex Mono',monospace;color:var(--ink-dim);
  border-left:2px solid var(--accent);padding-left:9px;pointer-events:none;
}
.axes b{color:var(--ink-2);font-weight:600}
#tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  border:1px solid var(--rule);background:rgba(9,14,19,.95);border-radius:7px;
  padding:9px 12px;max-width:290px;box-shadow:var(--shadow);z-index:5;
}
#tip .t-n{font:600 13px/1.3 'IBM Plex Mono',monospace;color:var(--accent-2)}
#tip .t-m{font:400 11px/1.4 'IBM Plex Mono',monospace;color:var(--ink-dim);margin-top:2px}
#tip .t-d{font-size:12px;line-height:1.55;color:var(--ink-2);margin-top:6px}

/* ---------- prose ---------- */
main.doc{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 90px}
section.blk{padding-top:56px}
.eyebrow{
  font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px;
}
section.blk > h2{font-size:clamp(23px,3.1vw,31px);font-weight:700;letter-spacing:-.005em;line-height:1.25}
section.blk > .lede{max-width:66ch;color:var(--ink-2);margin:12px 0 0;font-size:16px}
h3{font-size:17px;font-weight:600;margin:34px 0 8px;letter-spacing:-.005em}
p{margin:12px 0;max-width:74ch}
ul,ol{max-width:74ch;padding-left:20px;margin:12px 0}
li{margin:6px 0}
code{
  font-size:.885em;background:var(--panel-2);border:1px solid var(--rule-soft);
  border-radius:4px;padding:1px 5px;color:var(--accent-2);
}
.ref{font:500 11.5px/1 'IBM Plex Mono',monospace;color:var(--ink-dim)}

.tablewrap{overflow-x:auto;margin:20px 0;border:1px solid var(--rule);border-radius:9px;background:var(--ground-2)}
table{border-collapse:collapse;width:100%;min-width:660px;font-size:13.5px}
th,td{padding:11px 15px;text-align:left;border-bottom:1px solid var(--rule-soft);vertical-align:top}
thead th{
  font:600 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--panel);border-bottom:1px solid var(--rule);white-space:nowrap;
}
tbody th{font-weight:600;color:var(--ink);white-space:nowrap;font-size:13px}
td{color:var(--ink-2)}
td .mono{color:var(--ink);font-size:12.5px}
tbody tr:last-child th,tbody tr:last-child td{border-bottom:0}

pre{
  margin:16px 0;padding:15px 17px;overflow-x:auto;
  background:var(--ground-2);border:1px solid var(--rule);border-left:2px solid var(--accent);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.7;color:var(--ink-2);
}
pre b{color:var(--ink);font-weight:600}
pre i{color:var(--ink-dim);font-style:normal}
pre u{color:var(--good);text-decoration:none}

.steps{list-style:none;padding:0;margin:24px 0;counter-reset:s;max-width:100%}
.steps > li{
  counter-increment:s;position:relative;padding:0 0 0 46px;margin:0 0 22px;max-width:74ch;
}
.steps > li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;
  font:600 12px/1.55 'IBM Plex Mono',monospace;color:var(--accent);
  border:1px solid var(--rule);border-radius:5px;width:30px;text-align:center;background:var(--panel);
}
.steps h3{margin:0 0 4px;font-size:15.5px}
.steps p{margin:4px 0}

.note{
  border:1px solid var(--rule);border-radius:9px;background:var(--ground-2);
  padding:15px 18px;margin:22px 0;max-width:78ch;
}
.note b{color:var(--accent-2)}
.note p:first-child{margin-top:0}
.note p:last-child{margin-bottom:0}

figure{margin:26px 0}
figure svg{display:block;width:100%;height:auto;max-width:820px}
figcaption{font-size:12.5px;color:var(--ink-dim);margin-top:9px;max-width:74ch;line-height:1.6}

.pipe{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;margin:24px 0;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.pipe > div{flex:1 1 150px;padding:14px 16px;border-right:1px solid var(--rule-soft);background:var(--ground-2);min-width:0}
.pipe > div:last-child{border-right:0}
.pipe .k{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:6px}
.pipe .f{font:500 12.5px/1.45 'IBM Plex Mono',monospace;color:var(--ink);word-break:break-all}
.pipe .d{font-size:12px;color:var(--ink-dim);margin-top:5px;line-height:1.55}

footer{border-top:1px solid var(--rule);padding:26px clamp(16px,4vw,40px) 40px;color:var(--ink-dim);font-size:12.5px}
footer p{max-width:80ch;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
